<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Settings • Time to Salat</title>
  <link rel="stylesheet" href="./styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="settings-body">
    <main class="settings" role="main">
      <header class="settings-header">
        <a href="./index.html" class="back">← Back</a>
        <h1>Settings</h1>
      </header>

      <section class="card">
        <label for="method">Calculation method</label>
        <select id="method">
          <option value="MWL">Muslim World League</option>
          <option value="UmmAlQura">Umm al-Qura, Makkah</option>
          <option value="Egypt">Egyptian General Authority</option>
          <option value="Karachi">University of Islamic Sciences, Karachi</option>
          <option value="ISNA">Islamic Society of North America (ISNA)</option>
        </select>
        <p class="help">Choose how to compute Fajr/Isha. Defaults to Muslim World League.</p>
      </section>

      <section class="card">
        <label for="fontStyle">Font style</label>
        <select id="fontStyle">
          <option value="mono">Monospace (default)</option>
          <option value="digital">Digital / Display</option>
          <option value="sans">Sans-serif</option>
          <option value="serif">Serif</option>
        </select>
        <p class="help">Choose the clock’s font style.</p>
      </section>

      <section class="card">
        <div class="row">
          <div>
            <label for="lat">Latitude</label>
            <input id="lat" type="number" step="0.000001" placeholder="e.g., 24.7136" />
          </div>
          <div>
            <label for="lon">Longitude</label>
            <input id="lon" type="number" step="0.000001" placeholder="e.g., 46.6753" />
          </div>
        </div>
        <div class="row">
          <button id="useLocation" type="button">Use my location</button>
          <button id="save" type="button" class="primary">Save</button>
        </div>
        <p class="help">If location permission is denied, set coordinates manually.</p>
      </section>
    </main>

    <script type="module" src="./settings.js"></script>
  </body>
</html>
